<app-layout>
  <h1>Overview</h1>

  <app-form-wrapper>
    <app-form (currentURLEvent)="handleSubmit($event)" />
  </app-form-wrapper>

  <div class="list-wrapper">
    <h2>My favorite links</h2>
    <ul>
      @for (urlListItem of urlList().values(); track urlListItem.id) {
      <li>
        <div class="flex-row" matListItemContent>
          <span>{{ urlListItem.url }} </span>
          <button matIconButton (click)="deleteUrl(urlListItem.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </li>
      } @empty {
      <li>No items to display.</li>
      }
    </ul>
  </div>
</app-layout>
